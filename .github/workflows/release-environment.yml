name: Release environment targeted diagnostics
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Diagnostic scope
        type: choice
        options: [consumers, startup, default-dacl, windows, fixture, deepseek-error]
        default: consumers
permissions:
  contents: read
jobs:
  environment:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - run: git config --global core.symlinks false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
      - uses: actions/setup-node@v4
        if: inputs.scope == 'consumers' || inputs.scope == 'fixture' || inputs.scope == 'deepseek-error'
        with:
          node-version: '22.22.2'
      - name: Allocate owned diagnostic output
        run: |
          New-Item -ItemType Directory .goose/out/release-environment -ErrorAction Stop | Out-Null
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install pip==25.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare cold pinned Source and original build carrier
        if: inputs.scope == 'consumers' || inputs.scope == 'fixture' || inputs.scope == 'deepseek-error'
        run: |
          .venv/Scripts/python.exe -c "from scripts.verify_release import prepare_node_dependencies; from pathlib import Path; import os; prepare_node_dependencies(Path('.goose/out/release-environment').resolve(), dict(os.environ))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/browser108_gate.py --prepare .goose/tools/chromium108
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read actual hosted Windows startup context
        if: always() && (inputs.scope == 'consumers' || inputs.scope == 'startup')
        run: |
          .venv/Scripts/python.exe scripts/diagnose_windows_startup.py .goose/out/release-environment/windows-startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect default object ACL with fixed LUA and write restriction
        if: inputs.scope == 'default-dacl'
        run: |
          .venv/Scripts/python.exe scripts/diagnose_windows_startup.py --dacl .goose/out/release-environment/windows-default-dacl.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run direct cold-environment consumers
        if: inputs.scope == 'consumers'
        run: |
          $env:DSH_TEST_CHROMIUM = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:DSH_TEST_CHROMIUM108 = (Resolve-Path .goose/tools/chromium108/chrome-win/chrome.exe).Path
          $targetTemp = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) ('dsh-environment-temp-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $targetTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $targetTemp
          $env:TMP = $targetTemp
          .venv/Scripts/python.exe scripts/check_release_environment.py .goose/out/release-environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run original Windows failures and adjacent native consumers
        if: inputs.scope == 'windows'
        run: |
          $env:DSH_TEST_CHROMIUM = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $targetTemp = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) ('dsh-environment-temp-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $targetTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $targetTemp
          $env:TMP = $targetTemp
          .venv/Scripts/python.exe -c "from scripts import check_release_environment as gate; import sys; gate.NODES = ['tests/test_windows_acl_runner.py', 'tests/test_windows_confined_console.py', 'tests/test_local_sandbox_provider.py', 'tests/test_pwsh_executor.py', 'tests/test_canonical_pwsh_tool.py']; sys.argv = ['check_release_environment.py', '.goose/out/release-environment']; sys.exit(gate.main())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture the first shared release fixture failure
        if: inputs.scope == 'fixture'
        run: |
          $env:DSH_TEST_CHROMIUM = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:DSH_TEST_CHROMIUM108 = (Resolve-Path .goose/tools/chromium108/chrome-win/chrome.exe).Path
          $targetTemp = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) ('dsh-environment-temp-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $targetTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $targetTemp
          $env:TMP = $targetTemp
          .venv/Scripts/python.exe -c "from scripts import check_release_environment as gate; import sys; gate.NODES = ['tests/test_current_release_gate.py::test_extracted_physical_tree_is_required_and_cannot_hide_survivors[missing]']; sys.argv = ['check_release_environment.py', '.goose/out/release-environment']; sys.exit(gate.main())"
          exit $LASTEXITCODE
      - name: Capture independent raw DeepSeek error observations
        if: inputs.scope == 'deepseek-error'
        run: |
          $targetTemp = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) ('dsh-environment-temp-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $targetTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $targetTemp
          $env:TMP = $targetTemp
          $failed = $false
          foreach ($index in 0..2) {
            .venv/Scripts/python.exe scripts/deepseek_error_oracle.py --output ('.goose/out/release-environment/deepseek-error-' + $index + '.json')
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Package owned diagnostics
        if: always()
        run: |
          python scripts/package_release_diagnostics.py --source .goose/out/release-environment --archive .goose/out/release-environment.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-environment-diagnostics
          path: .goose/out/release-environment.zip
          if-no-files-found: error
